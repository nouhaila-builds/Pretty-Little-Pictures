[project]
name = "pretty-little-pictures"
version = "0.1.0"
description = "RGB to thermal generation under scarce paired data."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
